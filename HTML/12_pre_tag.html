<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRE TAG</title>
</head>
<body>
    <p>
        <pre>Lorem ipsum dolor sit amet
             consectetur adipisicing elit. Distinctio aspernatur labore asperiores natus unde illo molestiae, laborum aliquam praesentium
              iure ex, enim dicta veniam, quia nostrum          quis assumenda placeat maiores.
        </pre>
    </p>

    <!-- pre is used to display text as it is (without ignoring space & next line) -->
</body>
</html>
