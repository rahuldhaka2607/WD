<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Form</title>
</head>
<body>

    <form action="">
        <h2>Select Your Class</h2>

        <input type="checkbox" id="id1" name="class" value="Class X">
        <label for="id1">Class X</label>
        <br><br>

        <input type="checkbox" id="id2" name="class" value="Class XI">
        <label for="id2">Class XI</label>
        <br><br>

        <input type="checkbox" id="id3" name="class" value="Class XII">
        <label for="id3">Class XII</label>
    </form>

</body>
</html>
