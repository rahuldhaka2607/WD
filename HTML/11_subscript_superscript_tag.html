<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subscript and superscript</title>
</head>
<body>
    <h1>H<sub>2</sub>O</h1>
    <h1>3<sup>2</sup>=9</h1>

    <!-- these elements format incline text by slightly lowering or raising it relative to the main baseline -->
</body>
</html>
