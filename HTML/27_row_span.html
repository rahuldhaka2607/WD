<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1">
        <thead>
            <caption>Basic HTML Table</caption>
            <tr>
                <td>Student Id</td>
                <td>Student Name</td>
                <td>Gender</td>
                <td>Age</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1234</td>
                <td>Bill</td>
                <td rowspan="2">Male</td>
                <td>17</td>
            </tr>
            <tr>
                <td>1235</td>
                <td>John</td>
                <td>18</td>
            </tr>
            <tr>
                <td>1236</td>
                <td>olivia</td>
                <td rowspan="2">Female</td>
                <td>17</td>
            </tr>
            <tr>
                <td>1237</td>
                <td>Mia</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
